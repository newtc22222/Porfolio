<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Apply the saved (or OS) theme before first paint to avoid a light-theme
      flash. Keep the storage key in sync with src/components/ThemeToggle.tsx.
    -->
    <script>
      (function () {
        document.documentElement.classList.add('js');
        var saved = null;
        try {
          saved = localStorage.getItem('darkMode');
        } catch (e) {}
        var dark =
          saved !== null
            ? saved === 'true'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme',
          dark ? 'dark' : 'light'
        );
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/person-who-gargles.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Load the font stylesheet without blocking the first paint: it starts as
      a print stylesheet and switches to all media once it has loaded. Text
      shows in the fallback font until then (the fonts use display=swap).
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Martian+Mono:wght@400;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Martian+Mono:wght@400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Martian+Mono:wght@400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!--app-head-->
    <link
      rel="sitemap"
      type="application/xml"
      title="Sitemap"
      href="/sitemap.xml"
    />

    <!-- JSON-LD structured data (Person) -->

      {

        "name": "Phi Vo",
        "url": "https://phivo.dev/",

          "https://www.linkedin.com/in/phi-vo-tech/",
          "https://github.com/newtc22222",

          "https://www.facebook.com/fee.fight"
        ],
        "jobTitle": "Software Engineer",
        "mainEntityOfPage": {
          "@type": "WebPage",
          "@id": "https://phivo.dev/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
