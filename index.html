<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Apply the saved (or OS) theme before first paint to avoid a light-theme
      flash. Keep the storage key in sync with src/components/ThemeToggle.tsx.
    -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('darkMode');
        } catch (e) {}
        var dark =
          saved !== null
            ? saved === 'true'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme',
          dark ? 'dark' : 'light'
        );
      })();
    </script>
